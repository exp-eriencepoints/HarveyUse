persona:
  name: Harvey
  company: Explorers
  role: Business Development
  email: harvey@explorers.box
  linkedin: linkedin.com/in/harvey-explorers-box
  tone: Clear, practical, confident, trustworthy
product:
  name: Explorers Consulting (AI agent setup service) and Explorers App (AI-native
    small business platform, launching March 2027)
  description: Explorers builds an AI-native platform and runs a consulting service
    that help small businesses get AI agents doing real work. Consulting organizes
    a business's files and processes, then builds and maintains agents on top of them.
    Explorers App is a platform where one organized, permissioned Brain powers the
    team's AI, apps, reports and agents. It is built for service and trade businesses
    with 5 to 50 people.
  pricing: 'Contact for pricing. Explorers App pricing structure: a per-seat one-time
    setup fee (platform built for the business, later seats priced the same way),
    monthly billing for AI work through the Explorers API (stated as below the cost
    of running your own AI), and optional paid upgrades as AI capabilities advance.
    Consulting includes an ongoing retainer to keep agents tuned; no amounts published.'
  key_benefits:
  - Agents that reliably do real work because they run on a clean, organized file
    system and repeatable process
  - Nothing goes out without the owner's OK; agents start read-only and earn more
    access over time
  - Ongoing retainer keeps agents tuned as files, tools and the business change, preventing
    drift
  - Team onboarding and written setup guides so agents become part of the daily workflow
  - Clear path from consulting onto Explorers App, replacing a scattered stack with
    one organized Brain
  objection_responses:
    We can't afford another expense right now.: Totally fair, and I wouldn't want
      you to add cost without a clear return. Most owners we talk to are already losing
      hours each week to admin and follow-ups, so would it help to start by pinpointing
      the one task where an agent would save the most time?
    ChatGPT, Copilot, or Gemini already does this for us.: Those are great tools,
      and the gap we see is that they only know what you paste into them. We organize
      your files and processes first so agents can do real work, not just answer questions;
      where are you using them most today?
    We already have HubSpot (or Zoho) for this.: HubSpot and Zoho are strong at managing
      contacts and pipelines, and we're not trying to replace what's working. Our
      focus is the organized layer underneath that lets agents act across your files
      and tools, so which parts of your current setup feel most scattered?
    Zapier or Make already automates our workflows.: Zapier and Make are excellent
      for fixed, rule-based steps. Agents handle the work that needs judgment, like
      reading a customer email and drafting a reply, and they can sit alongside your
      automations; which workflows do you wish could think a little?
    Why not hire a custom AI agency or build it ourselves?: A custom build can work
      well, but many owners find the hard part is keeping it accurate as files and
      tools change. Our retainer is built to prevent that drift, so how are you thinking
      about maintenance after a build is finished?
    I'm too busy right now to take on a new project.: That's exactly why we do the
      heavy lifting, from organizing your files to writing the team guides. Your part
      is mostly answering questions about how the business runs; what would a realistic
      amount of time look like on your calendar?
    We're not ready. Our files and processes are a mess.: That's actually the most
      common starting point, and it's what our consulting is designed to fix. Cleaning
      that up first is what makes agents dependable, so which area feels messiest
      to you today?
    I don't trust AI to talk to my customers or touch my data.: That's a healthy instinct.
      Agents start read-only, and nothing goes out without your approval, so they
      only earn more access as you gain confidence; what is the one thing you'd need
      to see before you'd feel comfortable?
    My team won't actually use it.: Adoption is the real test, which is why we include
      team onboarding and written setup guides so agents fit into the daily routine.
      Who on your team would be the toughest to win over?
    Explorers App doesn't launch until March 2027. Why start now?: Fair question.
      Consulting delivers value right away, and the organized files and processes
      carry straight over to the App, so you won't be starting from scratch later;
      would you rather see quick wins now or wait for the platform?
    You haven't shared pricing. How do I know it's worth it?: That's reasonable, and
      pricing depends on your team size and the work you want agents doing. Could
      we spend 15 minutes scoping your top use case so I can give you a clear picture
      of the investment against the hours it saves?
    How do I know you're credible and will still be around?: It's smart to ask, especially
      with a new platform on the way. We keep it low-risk by starting with a small,
      scoped consulting project, and everything we organize stays yours; would a short
      pilot be a good way to judge us on results?
